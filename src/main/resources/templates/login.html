<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head><title>Login</title>    <style>
        button[type="submit"]:hover { background-color: #b91c1c !important; transform: translateY(-1px); }
    </style>
</head>
<body>
    <h2>User Login</h2>
    <div th:if="${param.error}" style="color:red">Invalid credentials!</div>
    <div th:if="${param.logout}" style="color:green">Logged out successfully.</div>
    <form th:action="@{/login}" method="post">
        Username: <input type="text" name="username" required /><br/><br/>
        Password: <input type="password" name="password" required /><br/><br/>
        <button type="submit" style="background-color: #dc2626; color: white; border: none; padding: 10px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px; transition: background-color 0.2s;">Login</button>
    </form>
    <br/>
    <a href="/signup">Need an account? Sign up here</a>
</body>
</html>
